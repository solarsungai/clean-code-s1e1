<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link href='https://fonts.googleapis.com/css?family=Lato:300,400,700' rel='stylesheet'>
    <link rel='stylesheet' href='style.css' media='screen' charset='utf-8'>
  </head>
  <body class='page'>
    <div class='info'>
      <img class='info-img' src='./eisenhower-matrix.jpg'>
      <a class='info-link' href='https://goal-life.com/page/method/matrix-eisenhower'>Want more details?</a>
    </div>
    <div class='main'>
      <p>
        <label class='new-task-label' for='new-task'>Add Item</label>
        <div class='task-row-wrapper'>
          <input class='input-text task' id='new-task' type='text'>
          <button class='btn'>Add</button>
        </div>
      </p>
      <h3 class='heading'>Todo</h3>
      <ul class='list' id='incomplete-tasks'>
        <li class='list-elem'>
          <input class='input-checkbox' type='checkbox'>
          <label class='task task-label'>Pay Bills</label>
          <input class='input-text task' type='text'>
          <button class='btn edit'>Edit</button>
          <button class='btn delete'>
            <img class='remove-img' src='./remove.svg'>
          </button>
        </li>
        <li class='list-elem edit-mode'>
          <input class='input-checkbox' type='checkbox'>
          <label class='task task-label'>Go Shopping</label>
          <input class='input-text task' type='text' value='Go Shopping'>
          <button class='btn edit'>Save</button>
          <button class='btn delete'>
            <img class='remove-img' src='./remove.svg'>
          </button>
        </li>
      </ul>
      <h3 class='heading'>Completed</h3>
      <ul class='list' id='completed-tasks'>
        <li class='list-elem'>
          <input class='input-checkbox' type='checkbox' checked>
          <label class='task task-label'>See the Doctor</label>
          <input class='input-text task' type='text'>
          <button class='btn edit'>Edit</button>
          <button class='btn delete'>
            <img class='remove-img' src='./remove.svg'>
          </button>
        </li>
      </ul>
    </div>
    <script src='app.js'></script>
  </body>
</html>
